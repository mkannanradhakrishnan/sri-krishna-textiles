    <style>

        /* ==========================================
           RESET
        ========================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            width: 100%;
            min-height: 100vh;

            background-color: white;

            font-family: "Times New Roman", serif;

            overflow-x: hidden;
        }


        /* ==========================================
           HEADER
        ========================================== */

        #header {
            width: 100%;

            min-height: 80px;

            background-color: rgb(229, 229, 194);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 15px 20px;
        }

        #pagename {
            color: rgb(114, 98, 98);

            font-size: clamp(26px, 4vw, 42px);

            text-align: center;

            transition: 0.5s;
        }

        #pagename:hover {
            transform: translateY(-3px);
        }


        /* ==========================================
           MAIN
        ========================================== */

        main {
            width: 100%;

            max-width: 1400px;

            margin: auto;

            padding: 20px;
        }


        /* ==========================================
           COLLECTION SECTION
        ========================================== */

        .collection-section {
            width: 100%;

            margin-bottom: 40px;
        }


        /* ==========================================
           SECTION TITLE
        ========================================== */

        .section-title {
            text-align: center;

            font-size: clamp(24px, 3vw, 32px);

            font-weight: bold;

            margin: 25px 0 12px;

            color: #333;
        }

        .section-line {
            width: 100%;

            border: none;

            border-top: 1px solid #999;

            margin-bottom: 25px;
        }


        /* ==========================================
           PRODUCT GRID
        ========================================== */

        .product-grid {
            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 20px;

            align-items: start;
        }


        /* ==========================================
           PRODUCT CARD
        ========================================== */

        .product-card {
            width: 100%;

            background-color: floralwhite;

            border: 1px solid #eeeeee;

            border-radius: 8px;

            padding: 10px;

            display: flex;

            flex-direction: column;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                background-color 0.3s ease;
        }

        .product-card:hover {
            background-color: #f5f5f5;

            transform: translateY(-5px);

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.15);
        }


        /* ==========================================
           IMAGE BOX

           Same height for every image.

           object-fit: contain keeps the COMPLETE
           image visible and prevents cropping.
        ========================================== */

        .image-box {
            width: 100%;

            height: 400px;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            background-color: #f5f5f5;

            border-radius: 6px;
        }


        /* ==========================================
           PRODUCT IMAGE
        ========================================== */

        .product-card img {
            width: 100%;

            height: 100%;

            object-fit: contain;

            object-position: center;

            display: block;

            border-radius: 6px;
        }


        /* ==========================================
           ENQUIRE LINK
        ========================================== */

        .enquire-link {
            display: block;

            width: 100%;

            text-decoration: none;

            margin-top: 10px;
        }


        /* ==========================================
           ENQUIRE BUTTON
        ========================================== */

        .buy {
            width: 100%;

            min-height: 45px;

            padding: 10px;

            background-color: white;

            color: #333;

            border: 1px solid #777;

            border-radius: 6px;

            font-family: "Times New Roman", serif;

            font-size: 17px;

            cursor: pointer;

            transition: 0.3s;
        }

        .buy:hover {
            background-color: #333;

            color: white;

            border-color: #333;

            transform: translateY(-2px);
        }


        /* ==========================================
           SMALL LAPTOP
        ========================================== */

        @media (max-width: 1100px) {

            main {
                padding: 18px;
            }

            .product-grid {
                grid-template-columns:
                    repeat(3, minmax(0, 1fr));

                gap: 18px;
            }

            .image-box {
                height: 380px;
            }
        }


        /* ==========================================
           TABLET
        ========================================== */

        @media (max-width: 800px) {

            #header {
                min-height: 70px;

                padding: 15px;
            }

            #pagename {
                font-size: 32px;
            }

            main {
                padding: 15px;
            }

            .product-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 18px;
            }

            .section-title {
                font-size: 27px;
            }

            .image-box {
                height: 420px;
            }
        }


        /* ==========================================
           MOBILE
        ========================================== */

            main {

            .section-title {
                font-size: 24px;

            }

            .section-line {
                margin-bottom: 18px;
            }

            .product-grid {
                width: 100%;

                grid-template-columns: 1fr;

                gap: 20px;

                padding: 0;
            }

            .product-card {
                width: 100%;

                max-width: 450px;

                margin-left: auto;

                margin-right: auto;

                padding: 10px;
            }

            .image-box {
                width: 100%;

                height: 450px;
            }

            .product-card img {
                width: 100%;

                height: 100%;

                object-fit: contain;

                object-position: center;
            }

            .buy {
                width: 100%;

                min-height: 48px;

                font-size: 18px;
            }
        }


        /* ==========================================
           VERY SMALL PHONES
        ========================================== */

            .product-grid {
                gap: 15px;
            }

            .image-box {
                height: 400px;
            }

            .buy {
                font-size: 17px;
            }
        }
