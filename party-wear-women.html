<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Party Wear | Sri Krishna Textiles</title>

    <meta name="description"
        content="Explore party and western wear including lace, skirts and lehenga collections at Sri Krishna Textiles.">

    <meta name="keywords"
        content="Sri Krishna Textiles, party wear, western wear, lace, skirts, lehenga">

        content="Sri Krishna Textiles">

    <style>

        /* ==========================================
           RESET
        ========================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            width: 100%;
            min-height: 100vh;

            background-color: white;

            font-family: "Times New Roman", serif;

            overflow-x: hidden;
        }


        /* ==========================================
           HEADER
        ========================================== */

        #header {

            width: 100%;

            min-height: 80px;

            background-color: rgb(229, 229, 194);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 15px 20px;
        }


        #pagename {

            color: rgb(114, 98, 98);

            font-size: clamp(26px, 4vw, 42px);

            text-align: center;

            transition: 0.5s;
        }


        #pagename:hover {

            transform: translateY(-3px);
        }


        /* ==========================================
           COLLECTION SECTION
        ========================================== */

        .collection-section {

            width: 100%;

            margin-bottom: 35px;

            padding: 0 20px;
        }


        /* ==========================================
           SECTION TITLE
        ========================================== */

        .section-title {

            text-align: center;

            font-size: clamp(24px, 3vw, 32px);

            font-weight: bold;

            margin: 25px 0 12px;

            color: #333;
        }


        .section-line {

            width: 100%;

            border: none;

            border-top: 1px solid #999;

            margin-bottom: 25px;
        }


        /* ==========================================
           PRODUCT GRID
        ========================================== */

        .product-grid {

            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 20px;

            align-items: start;
        }


        /* ==========================================
           PRODUCT CARD
        ========================================== */

        .product-card {

            width: 100%;

            background-color: floralwhite;

            border: 1px solid #eeeeee;

            border-radius: 8px;

            padding: 10px;

            display: flex;

            flex-direction: column;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                background-color 0.3s ease;
        }


        .product-card:hover {

            background-color: #f5f5f5;

            transform: translateY(-5px);

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.15);
        }


        /* ==========================================
           PRODUCT IMAGES
           
           Same image area for all products.
           object-fit: contain prevents cropping.
        ========================================== */

        .product-card img {

            width: 100%;

            height: 500px;

            max-width: 100%;

            display: block;

            object-fit: contain;

            border-radius: 6px;

            background-color: #f5f5f5;
        }


        /* ==========================================
           ENQUIRE LINK
        ========================================== */

        .enquire-link {

            display: block;

            width: 100%;

            text-decoration: none;

            margin-top: 10px;
        }


        /* ==========================================
           ENQUIRE BUTTON
        ========================================== */

        .buy {

            width: 100%;

            min-height: 45px;

            padding: 10px;

            background-color: white;

            color: #333;

            border: 1px solid #777;

            border-radius: 6px;

            font-family: "Times New Roman", serif;

            font-size: 17px;

            cursor: pointer;

            transition: 0.3s;
        }


        .buy:hover {

            background-color: #333;

            color: white;

            border-color: #333;

            transform: translateY(-2px);
        }


        /* ==========================================
           SMALL LAPTOP
        ========================================== */

        @media (max-width: 1100px) {

            .product-grid {

                grid-template-columns:
                    repeat(3, minmax(0, 1fr));

                gap: 18px;
            }


            .collection-section {

                padding: 0 18px;
            }


            .product-card img {

                height: 430px;
            }
        }


        /* ==========================================
           TABLET
        ========================================== */

        @media (max-width: 800px) {

            #header {

                min-height: 70px;

                padding: 15px;
            }


            #pagename {

                font-size: 32px;
            }


            .collection-section {

                padding: 0 15px;
            }


            .product-grid {

                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 18px;
            }


            .section-title {

                font-size: 27px;
            }


            .product-card img {

                height: 400px;
            }
        }


        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 600px) {

            #header {

                width: 100%;

                min-height: 65px;

                padding: 15px 10px;
            }


            #pagename {

                font-size: 27px;

                white-space: normal;
            }


            .collection-section {

                width: 100%;

                padding: 0 10px;

                margin-bottom: 25px;
            }


            .section-title {

                font-size: 24px;

                margin-top: 20px;

                margin-bottom: 10px;
            }


            .section-line {

                margin-bottom: 18px;
            }


            .product-grid {

                width: 100%;

                grid-template-columns: 1fr;

                gap: 20px;

                padding: 0;
            }


            .product-card {

                width: 100%;

                max-width: 450px;

                margin-left: auto;

                margin-right: auto;

                padding: 10px;
            }


            .product-card img {

                width: 100%;

                height: 450px;

                max-width: 100%;

                object-fit: contain;

                display: block;
            }


            .buy {

                width: 100%;

                min-height: 48px;

                font-size: 18px;
            }
        }


        /* ==========================================
           VERY SMALL PHONES
        ========================================== */

        @media (max-width: 350px) {

            #header {

                padding: 12px 8px;
            }


            #pagename {

                font-size: 23px;
            }


            .collection-section {

                padding: 0 7px;
            }


            .section-title {

                font-size: 21px;
            }


            .product-card {

                padding: 7px;
            }


            .product-grid {

                gap: 15px;
            }


            .product-card img {

                height: 400px;
            }


            .buy {

                font-size: 17px;
            }
        }

    </style>

</head>
